# i.MX SoC Feature Configuration

[feature_descriptions]
g3d = 3D GPU support
g2d-gpu = 2D implemented on vsi GPU
g2d-dpuv1 = 2D implemented on DPU v1
g2d-dpuv2 = 2D implemented on DPU v2
ipu = Image Processing Unit
pxp-legacy = Pixel Pipeline version 1 and 2 on imx6 and imx7
pxp-v3 = Pixel Pipeline version 3 on imx93 and 8ulp
pxp-v4 = Pixel Pipeline version 4 on imx943
vpu = Video Processing Unit
dpu-v1 = Display Processing Unit on imx8q
dpu-v2 = Display Processing Unit on imx95x
dcss = Display Controller SubSystem
lcdif = LCD Interface
isi = Image Sensing Interface
npu = Neural Processing Unit

[chip_groups]
# 2D GPU support (any g2d-xxx feature)
g2d = MX6Q;MX6SL;MX6SX;MX7ULP;MX8;MX8Q;MX8MM;MX8MP;MX8ULP;MX95;MX952

# VPU decoder groups
hantro = MX8MQ;MX8MM;MX8MP
amphion = MX8Q

# PXP support
pxp = MX6SL;MX6SLL;MX6SX;MX6UL;MX7D;MX8ULP;MX93;MX94

# DPU support
dpu = MX8;MX8Q;MX95;MX952

# Series groups
imx-legacy = MX6Q;MX6SL;MX6SLL;MX6SX;MX6UL;MX7D;MX7ULP
imx8 = MX8;MX8Q;MX8MQ;MX8MM;MX8MN;MX8MP;MX8ULP
imx9 = MX91;MX93;MX94;MX95;MX952


# SoC definitions: [soc.<chip_code>]
# soc_id: semicolon separated list of matching soc_id strings
# features: semicolon separated list of supported features
[soc.MX6Q]
soc_id = i.MX6DL;i.MX6Q;i.MX6QP
features = g3d;g2d-gpu;ipu;vpu

[soc.MX6SL]
soc_id = i.MX6SL
features = g2d;pxp-legacy

[soc.MX6SLL]
soc_id = i.MX6SLL
features = pxp-legacy

[soc.MX6SX]
soc_id = i.MX6SX
features = g3d;g2d;pxp-legacy

[soc.MX6UL]
soc_id = i.MX6UL;i.MX6ULL
features = pxp-legacy

[soc.MX7D]
soc_id = i.MX7D
features = pxp-legacy

[soc.MX7ULP]
soc_id = i.MX7ULP
features = g3d;g2d-gpu

[soc.MX8]
soc_id = i.MX8DV
features = g3d;g2d-dpuv1;dpu-v1

[soc.MX8Q]
soc_id = i.MX8QM;i.MX8QXP
features = g3d;g2d-dpuv1;vpu;dpu-v1

[soc.MX8MQ]
soc_id = i.MX8MQ
features = g3d;vpu;dcss

[soc.MX8MM]
soc_id = i.MX8MM
features = g3d;g2d-gpu;vpu;lcdif

[soc.MX8MN]
soc_id = i.MX8MN
features = g3d;isi;lcdif

[soc.MX8MP]
soc_id = i.MX8MP
features = g3d;g2d-gpu;vpu;isi;lcdif

[soc.MX8ULP]
soc_id = i.MX8ULP
features = g3d;g2d-gpu;pxp-v3;dcss

[soc.MX93]
soc_id = i.MX93
features = pxp-v3;lcdif;isi

[soc.MX95]
soc_id = i.MX95
features = g3d;g2d-dpuv2;vpu;dpu-v2;isi

[soc.MX952]
soc_id = i.MX952;i.MX937
features = g3d;g2d-dpuv2;vpu;dpu-v2;isi

[soc.MX91]
soc_id = i.MX91
features = lcdif;isi

[soc.MX94]
soc_id = i.MX943;i.MX942;i.MX941
features = pxp-v4;lcdif;isi
